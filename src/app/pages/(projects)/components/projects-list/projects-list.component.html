<ul>
  @for(post of posts; track post.slug) {
  <li [routerLink]="['/projects', post.slug]" class="project-list-item rad-shadow">
    <h4> {{ post.attributes.title }} </h4>
    <p>{{ post.attributes.description }}</p>
    <div class="tags">
      @for(tag of post.attributes.tags; track tag) {
      <span>{{tag}}</span>
      }
    </div>
  </li>
  }
</ul>
